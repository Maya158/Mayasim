[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "Mayasim"
version = "0.1.0"
description = "This project contains an in silico mass spectrometry experiment. It aims to simulate the workflow from protein extraction to spectrum visualisation."
readme = "README.md"
license = { text = "MIT" }
authors = [
    {name = "Maya Stange", email = "maya.stange@stud.uni-heidelberg.de"}
]
requires-python = ">=3.10"

dependencies = [
    "numpy",
    "pytest",
    "pandas",
    "matplotlib",
    "pyteomics"
]

[tool.setuptools.packages.find]
include = ["Mayasim"]
